[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-context-packager"
version = "1.0.0"
authors = [
    {name = "Kyle Homen", email = "k_homen@hotmail.com"}
]
description = "A command-line tool to analyze local git repositories and create a text file containing repository content optimized for sharing with Large Language Models"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
keywords = ["git", "repository", "analysis", "llm", "ai", "context"]
dependencies = [
    "GitPython>=3.1.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/kphero/repository-context-packager"
Issues = "https://github.com/kphero/repository-context-packager/issues"

[project.scripts]
scan-repo = "repository_context_packager.scan_repo:main"

[tool.setuptools]
packages = ["repository_context_packager", "repository_context_packager.analyzer"]